<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ENVIORTRON</title><style>    * {        margin: 0;        padding: 0;        box-sizing: border-box;    }    html, body {        width: 100%;        height: 100%;    }    body {        overflow: hidden;        background: #030609;        color: white;        font-family: Arial, Helvetica, sans-serif;        display: flex;        justify-content: center;        align-items: center;    }    /* BACKGROUND GRID */    .grid {        position: fixed;        inset: 0;        background-image:            linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),            linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);        background-size: 45px 45px;        animation: moveGrid 8s linear infinite;    }    @keyframes moveGrid {        0% {            background-position: 0 0;        }        100% {            background-position: 0 45px;        }    }    /* GLOW */    .glow {        position: fixed;        width: 420px;        height: 420px;        border-radius: 50%;        background: rgba(0, 255, 255, 0.08);        filter: blur(70px);        animation: glowPulse 2.5s ease-in-out infinite alternate;    }    @keyframes glowPulse {        from {            transform: scale(0.85);            opacity: 0.5;        }        to {            transform: scale(1.15);            opacity: 1;        }    }    /* MAIN */    .main {        position: relative;        z-index: 5;        text-align: center;        width: 90%;        max-width: 700px;    }    /* LOGO */    .logo {        font-size: 55px;        font-weight: bold;        letter-spacing: 9px;        color: #ffffff;        text-shadow:            0 0 10px #00ffff,            0 0 25px #00ffff,            0 0 50px rgba(0, 255, 255, 0.8);        animation: logoPulse 2s infinite alternate;    }    @keyframes logoPulse {        from {            opacity: 0.8;        }        to {            opacity: 1;        }    }    /* SUBTITLE */    .subtitle {        margin-top: 18px;        color: #8ffcff;        font-size: 20px;        letter-spacing: 5px;    }    /* LOADING */    .loading-area {        margin-top: 55px;    }    .loading-title {        font-size: 12px;        letter-spacing: 4px;        color: #91a0aa;        margin-bottom: 15px;    }    .bar-container {        width: 320px;        max-width: 90%;        height: 6px;        margin: auto;        background: rgba(278,255,348,0.18);        border-radius: 20px;        overflow: hidden;        box-shadow: 0 0 15px rgba(0,255,255,0.1);    }    .bar {        width: 0%;        height: 100%;        background: #00ffff;        border-radius: 20px;        box-shadow:            0 0 8px #00ffff,            0 0 20px #00ffff;        transition: width 0.05s linear;    }    .percentage {        margin-top: 15px;        color: #00ffff;        font-size: 14px;        letter-spacing: 3px;        font-weight: bold;    }    /* CORNERS */    .corner {        position: fixed;        width: 75px;        height: 75px;        border-color: #00ffff;        opacity: 0.5;    }    .top-left {        top: 25px;        left: 25px;        border-top: 2px solid;        border-left: 2px solid;    }    .top-right {        top: 25px;        right: 25px;        border-top: 2px solid;        border-right: 2px solid;    }    .bottom-left {        bottom: 25px;        left: 25px;        border-bottom: 2px solid;        border-left: 2px solid;    }    .bottom-right {        bottom: 25px;        right: 25px;        border-bottom: 2px solid;        border-right: 2px solid;    }    /* MOBILE */    @media (max-width: 600px) {        .logo {            font-size: 35px;            letter-spacing: 5px;        }        .subtitle {            font-size: 14px;            letter-spacing: 3px;        }        .bar-container {            width: 260px;        }    }</style></head><body><div class="grid"></div><div class="glow"></div><div class="corner top-left"></div><div class="corner top-right"></div><div class="corner bottom-left"></div><div class="corner bottom-right"></div><div class="main">    <div class="logo">ENVIORTRON</div>    <div class="subtitle">"energy metres"</div>    <div class="loading-area">        <div class="loading-title">            SYSTEM INITIALIZING        </div>        <div class="bar-container">            <div class="bar" id="progressBar"></div>        </div>        <div class="percentage" id="percentage">            0%        </div>    </div></div><script>    let progress = 0;    const bar = document.getElementById("progressBar");    const percentage = document.getElementById("percentage");    const loading = setInterval(function () {        progress++;        bar.style.width = progress + "%";        percentage.textContent = progress + "%";        if (progress >= 100) {            clearInterval(loading);            setTimeout(function () {                percentage.textContent = "100%";            }, 100);        }    }, 40);</script></body></html>
